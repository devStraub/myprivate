# Fipas Roleplay - configuracao principal
# Credenciais ficam em secrets.cfg (ignorado pelo Git).

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48

set gamename rdr3
set sv_enforceGameBuild 1491
set onesync on

# Localizacao
sets locale "pt-BR"
setr rsg_locale "pt-br"
setr ox:locale "pt-br"

# Identidade
sv_hostname "Fipas Roleplay"
sets sv_projectName "Fipas Roleplay"
sets sv_projectDesc "Roleplay RedM brasileiro sobre RSG Framework"
sets tags "redm,rsg,roleplay,brasil,pt-br,fipas"
sets Framework "RSG"
sets Desenvolvedor "devStraub"
load_server_icon server-icon.png

# Banco e rede
set mysql_slow_query_warning 300
set sv_experimentalNetGameEventHandler false
set txAdmin-menuPtfxDisable true

# Voz
setr voice_useSendingRangeOnly false
setr voice_use3dAudio true
setr voice_defaultVoiceMode 2
setr voice_enableUi 1

# ox_lib / ox_target
setr ox:primaryColor red
setr ox:primaryShade 8
setr UseTarget true

# Segredos e administradores
exec secrets.cfg
exec permissions.cfg

# Recursos padrao Cfx
ensure mapmanager
ensure spawnmanager
ensure sessionmanager-rdr3

# Banco e bibliotecas - ordem obrigatoria
ensure oxmysql
ensure ox_lib
ensure PolyZone
ensure progressbar

# Inicializacao central do RSG
ensure rsg-core
ensure rsg-multicharacter
ensure rsg-spawn
ensure rsg-menubase
ensure ox_target
ensure chat-redm

# Grupos de recursos
ensure [standalone]
ensure [framework]
ensure [mapmods]
ensure [fipas]

# Permissoes exigidas pelo weathersync
exec resources/[standalone]/weathersync/permissions.cfg
